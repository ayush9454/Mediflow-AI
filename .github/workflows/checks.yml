name: Project checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend and test dependencies
        run: |
          python -m pip install uv==0.13.4
          uv sync --project backend --locked --extra dev --extra evaluation --extra processing
      - name: Install bounded processing test engine
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - name: Check Python formatting and lint
        run: |
          backend/.venv/bin/ruff format --check --config backend/pyproject.toml backend tools
          backend/.venv/bin/ruff check --config backend/pyproject.toml backend tools
      - name: Typecheck backend
        run: backend/.venv/bin/mypy --config-file backend/pyproject.toml backend/src
      - name: Compile Python sources
        run: backend/.venv/bin/python -m compileall -q backend/src tools
      - name: Test contracts, safe API errors and fail-closed adapters
        run: backend/.venv/bin/python -m pytest backend/tests
      - name: Test hosting probe authentication and cloud guards
        run: backend/.venv/bin/python -m unittest discover -s tools/hosting_spike -p 'test_*.py'
      - name: Check generated contracts
        run: backend/.venv/bin/python tools/export_contracts.py --check
      - name: Verify worker at the deployment resource envelope
        run: |
          backend/.venv/bin/python -m mediflow.processing fixtures evaluation/fixtures/v1 --output .tooling/processing-fixtures
          docker build -f backend/Dockerfile.worker -t mediflow-worker backend
          mkdir -p .tooling/processing-results
          chmod 777 .tooling/processing-results
          docker run --rm --network none --cpus=.5 --memory=1g --pids-limit=64 -v "$PWD/.tooling/processing-fixtures:/fixtures:ro" -v "$PWD/.tooling/processing-results:/results" mediflow-worker python -m mediflow.processing benchmark /fixtures --output /results/processing.json
          backend/.venv/bin/python tools/check_processing_report.py .tooling/processing-results/processing.json

  firebase-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install emulator and test dependencies
        run: |
          python -m pip install uv==0.13.4
          uv sync --project backend --locked --extra dev --extra evaluation --extra processing
          npm install --global firebase-tools@15.34.0
      - name: Install OCR for upload admission tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - name: Verify real emulator tokens and deny-all client rules
        run: firebase emulators:exec --config firebase.json --project demo-mediflow --only auth,firestore 'MEDIFLOW_ENV=test MEDIFLOW_UPLOAD_TEST_FIRESTORE=1 backend/.venv/bin/python -m pytest backend/tests/test_firebase_emulators.py backend/tests/test_uploads.py'

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: dart run tool/contract_smoke.dart
      - name: Build foundation debug APK
        run: flutter build apk --debug --no-pub

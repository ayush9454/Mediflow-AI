[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mediflow-backend"
version = "0.1.0"
description = "Synthetic laboratory document workflow API"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "pydantic==2.11.7",
  "uvicorn==0.35.0",
  "firebase-admin>=7,<8",
  "azure-storage-blob>=12.28,<13",
  "azure-storage-queue>=12.15,<13",
  "azure-identity>=1.25,<2",
  "httpx>=0.28.1,<1",
]

[project.optional-dependencies]
processing = ["pypdf>=6,<7", "pypdfium2>=5,<6", "pillow>=12,<13"]
evaluation = [
  "reportlab>=4.4,<5",
  "pillow>=12,<13",
  "pypdf>=6,<7",
  "pypdfium2>=5,<6",
]
dev = [
  "pytest>=8.4.2,<9",
  "ruff>=0.12,<1",
  "mypy>=1.18,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"**/mediflow/api.py" = ["B008"] # FastAPI dependencies are resolved per request.

[tool.ruff.lint.isort]
known-first-party = ["mediflow"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.pydantic-mypy]
init_forbid_extra = true

[[tool.mypy.overrides]]
module = ["firebase_admin", "firebase_admin.*"]
ignore_missing_imports = true
